[project]
name = "oncofiles"
version = "5.18.1-dev"
description = "AI-powered medical document management for cancer patients and caregivers. Connects Google Drive, Gmail, and Calendar to Claude, ChatGPT, and any MCP client."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.0",
    "anthropic>=0.43.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0,<4",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    "sqlglot>=25.0.0",
    "python-multipart>=0.0.18",
    # #952: AES-GCM of the queued inbound mail payload. Already in the lock
    # through authlib / google-auth; declared because we import it directly.
    "cryptography>=44.0.0",
    # #950: DKIM verification of inbound mail on the raw message
    # (inbound_dkim.py). dkimpy (zlib/BSD-style licence), dnspython (ISC) for
    # the key lookups, pynacl (Apache-2.0) for ed25519-sha256 signatures.
    "dkimpy~=1.1.8",
    "dnspython~=2.9.2",
    "pynacl~=1.6.2",
    # DKIM alignment never on a public suffix d= (#966): the Public Suffix List is
    # bundled in the package (MPL-2.0, like the list itself), never fetched at
    # runtime. Pinned to a release at least two weeks old; bump to refresh.
    "publicsuffixlist==1.1.2.20261106",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]
backup = [
    "google-cloud-storage>=2.18.0",
]

[project.scripts]
oncofiles-mcp = "oncofiles.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
