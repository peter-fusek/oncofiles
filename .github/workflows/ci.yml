name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Token workflowu len na čítanie (repo je verejné, PR z forkov spúšťajú lint a test).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest

  # Produkčný image (linux/arm64, Mac mini) sa stavia tu, nie v produkčnej VM.
  # Push do main: push do GHCR ako ghcr.io/peter-fusek/oncofiles:<sha> a :main.
  # PR: len build (overenie, že Dockerfile prejde), bez loginu a bez pushu.
  # Coolify potom len stiahne image cez deploy/Dockerfile.coolify (FROM …:${SOURCE_COMMIT}).
  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/peter-fusek/oncofiles
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=oncofiles-arm64
          cache-to: type=gha,scope=oncofiles-arm64,mode=max

  # Deploy na Mac mini (Coolify vo VM), len po pushi do main a zelených testoch.
  # Coolify API nie je z internetu dostupné, runner sa preto pripojí do tailnetu
  # ako efemérny uzol s tagom tag:ci (tailnet ACL povoľuje tag:ci len na Coolify API a port 80 VM).
  # Vypínač: repo variable DEPLOY_ENABLED=true. Kým nie je nastavená, job sa preskočí.
  # Secrets (repo je verejné, logy tiež, preto aj URL a UUID ako secrets, nech sú v logu maskované):
  #   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, COOLIFY_API_TOKEN, COOLIFY_URL, COOLIFY_APP_UUID, HEALTH_URL
  # Variables: DEPLOY_ENABLED. ACL musí povoliť tag:ci aj na port 80 VM, ak HEALTH_URL ide cez tailnet.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Join tailnet (tag:ci)
        uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # A deploy kills an in-process curated run (#581). Continuous mode runs
      # are short (a few documents), so wait for a gap instead of interrupting.
      - name: Wait for no active curated run
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://oncofiles.com/health' }}
        run: |
          for i in $(seq 1 40); do
            active=$(curl -fsS -m 10 "$HEALTH_URL" | jq -r '.curated_run_active // false' || true)
            # Only an explicit true waits: an unreachable app gets its deploy at once.
            if [ "$active" != "true" ]; then echo "curated_run_active=${active:-unknown} — deploying"; exit 0; fi
            echo "[$i] curated_run_active=${active} — waiting 30 s"
            sleep 30
          done
          echo "::warning::a curated run is still active after 20 min — deploying anyway (journal recovers it)"

      - name: Trigger Coolify deploy and wait
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Accept: application/json")
          # Coolify >= 4.6: /deploy je POST (GET vracia 405)
          resp=$(curl -fsS -m 30 -X POST "${auth[@]}" "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          dep=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$dep" ]; then echo "Coolify did not return a deployment_uuid"; echo "$resp"; exit 1; fi
          echo "Deployment ${dep} queued for ${GITHUB_SHA}"
          for i in $(seq 1 120); do
            status=$(curl -fsS -m 15 "${auth[@]}" "${COOLIFY_URL}/api/v1/deployments/${dep}" | jq -r '.status')
            echo "[$i] status=${status}"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*|error) echo "Deploy ${status}. Logs: Coolify UI → oncofiles → Deployments"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deployment ${dep}"; exit 1

      # Pred prepnutím DNS nastav secret HEALTH_URL na tailnet adresu (sslip.io), potom ho zmaž (default https://oncofiles.com/health)
      - name: Smoke test /health
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://oncofiles.com/health' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS -m 10 "$HEALTH_URL" | jq -e '.status == "ok"' >/dev/null; then
              echo "$HEALTH_URL OK"; exit 0
            fi
            sleep 10
          done
          echo "$HEALTH_URL did not return ok"; exit 1
